spring.application.name=demo

# Banco de dados H2 em memória para desenvolvimento local.
spring.datasource.url=jdbc:h2:mem:organizador;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Cria e atualiza as tabelas a partir das entidades JPA.
spring.jpa.hibernate.ddl-auto=update

# Console disponível em http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
